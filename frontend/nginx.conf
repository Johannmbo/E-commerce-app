server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Même logique que le proxy Vite : chaque préfixe vers son microservice.
    location /customer-service/  { proxy_pass http://e-commerce-customer-service:8082; }
    location /inventory-service/ { proxy_pass http://e-commerce-inventory-service:8083; }
    location /billing-service/   { proxy_pass http://e-commerce-billing-service:8084; }
    location /order-service/     { proxy_pass http://e-commerce-order-service:8085; }

    location / {
        try_files $uri /index.html;
    }
}
